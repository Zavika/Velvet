<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Velvet">
<meta name="theme-color" content="#0f0b12">
<title>Velvet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
/* Layout: dark velvet ground, full-bleed hero, horizontal rails, iOS-style bottom tab bar, sheets slide up */
:root{
  --ink:#0f0b12; --panel:#1b1421; --panel-2:#251c2c; --line:rgba(255,214,232,.09);
  --text:#f7eef3; --muted:#a8969f; --rose:#ff8fb6; --rose-deep:#d9507c;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:15px/1.45 var(--body);overscroll-behavior:none}
body.typing .tabbar{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:8px}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:calc(var(--top) + 32px) var(--gr) calc(var(--bot) + 32px) var(--gl);
  background:radial-gradient(120% 80% at 80% -10%, rgba(255,143,182,.22), transparent 60%),radial-gradient(90% 60% at 0% 110%, rgba(217,80,124,.18), transparent 60%),var(--ink)}
.login-card{width:100%;max-width:380px;display:grid;gap:22px}
.brand{font:800 56px/0.9 var(--display);letter-spacing:-.04em}
.brand span{color:var(--rose)}
.login-card p{margin:0;color:var(--muted)}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);outline:none}
.field input:focus{border-color:var(--rose)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:700}
.btn-rose{background:var(--rose);color:#1a0b12}
.btn-rose:active{background:var(--rose-deep)}
.btn-glass{background:rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.err{color:#ff9a9a;font-size:14px;min-height:1em}

/* ---------- app shell ---------- */
#app{min-height:100%;padding-bottom:calc(var(--bot) + 76px)}
.topbar{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--top) + 10px) var(--gr) 10px var(--gl);background:linear-gradient(var(--ink),rgba(15,11,18,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.logo{font:800 24px/1 var(--display);letter-spacing:-.03em}
.logo span{color:var(--rose)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.icon-btn svg{width:18px;height:18px}

.tabbar{position:fixed;inset:auto 0 0;z-index:30;display:flex;justify-content:space-around;
  padding:8px var(--gr) calc(var(--bot) + 8px) var(--gl);background:rgba(20,14,24,.82);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-top:1px solid var(--line)}
.tab{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 18px}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--rose)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(72vh,560px);display:flex;align-items:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transform:scale(1.04)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--ink) 4%,rgba(15,11,18,.55) 45%,rgba(15,11,18,.15) 80%,rgba(15,11,18,.6))}
.hero-in{position:relative;z-index:1;padding:0 var(--gr) 24px var(--gl);display:grid;gap:12px;max-width:720px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.hero h1{margin:0;font:800 clamp(36px,10vw,64px)/.95 var(--display);letter-spacing:-.035em;text-wrap:balance}
.hero p{margin:0;color:rgba(247,238,243,.8);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- rails ---------- */
.rail{display:grid;gap:12px;margin-top:26px}
.rail h2{margin:0;padding:0 var(--gr) 0 var(--gl);font:700 21px/1.1 var(--display);letter-spacing:-.02em}
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px var(--gr) 6px var(--gl);scroll-padding-left:var(--gl);scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.card{flex:none;scroll-snap-align:start;display:grid;gap:8px;text-align:left;width:128px}
.card.wide{width:236px}
.art{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(140deg,var(--panel-2),var(--panel));aspect-ratio:2/3;max-width:100%}
.card.wide .art{aspect-ratio:16/9}
.art img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:active .art img{transform:scale(.97)}
.art .ph{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font:700 14px/1.15 var(--display);color:var(--muted)}
.bar{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose)}
.card .t{font-weight:600;font-size:14px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:12px;color:var(--muted);margin-top:-5px}

/* ---------- pages ---------- */
.page{padding:calc(var(--top) + 64px) 0 0}
.page-h{padding:0 var(--gr) 0 var(--gl);margin:0 0 14px;font:800 34px/1 var(--display);letter-spacing:-.035em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--gr) 14px var(--gl);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--rose);color:#1a0b12;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;padding:0 var(--gr) 0 var(--gl)}
.grid .card{width:auto}
.search-box{margin:0 var(--gr) 18px var(--gl);display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.search-box svg{width:18px;height:18px;color:var(--muted);flex:none}
.search-box input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px}
.empty{padding:40px var(--gr) 0 var(--gl);color:var(--muted);text-align:center}
.more{display:flex;justify-content:center;padding:20px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,143,182,.2);border-top-color:var(--rose);animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- detail sheet ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.d-hero{position:relative;aspect-ratio:16/10;max-height:62vh;width:100%;background:var(--panel) center/cover}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--ink),rgba(15,11,18,0) 60%)}
.d-close{position:fixed;z-index:45;top:calc(var(--top) + 10px);right:var(--gr)}
.d-body{position:relative;margin-top:-70px;padding:0 var(--gr) 40px var(--gl);display:grid;gap:14px;max-width:820px}
.d-body h1{margin:0;font:800 clamp(30px,8vw,52px)/.98 var(--display);letter-spacing:-.035em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.d-body p.ov{margin:0;color:rgba(247,238,243,.82);max-width:65ch}
.sec-h{margin:12px 0 0;font:700 18px/1.1 var(--display)}
.sources{display:grid;gap:8px}
.src{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.src .n{font-weight:600;font-size:14px;line-height:1.3;word-break:break-word;min-width:0}
.src .x{font-size:12px;color:var(--muted);margin-top:2px}
.src .play{width:34px;height:34px;border-radius:50%;background:var(--rose);color:#1a0b12;display:grid;place-items:center}
.src .play svg{width:14px;height:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:rgba(255,154,154,.14);color:#ff9a9a;margin-left:6px}
.eps{display:grid;gap:12px}
.ep{display:grid;grid-template-columns:132px 1fr;gap:12px;text-align:left;align-items:start}
.ep .art{aspect-ratio:16/9}
.ep .t{font-weight:600;font-size:14px}
.ep .s{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}

/* ---------- player ---------- */
#player{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center}
#player video{width:100%;height:100%;background:#000}
#player .icon-btn{position:absolute;top:calc(var(--top) + 12px);left:var(--gl);z-index:2}
#pmsg{position:absolute;bottom:calc(var(--bot) + 80px);left:var(--gl);right:var(--gr);text-align:center;color:#ff9a9a;font-size:14px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand">Velvet<span>.</span></div>
    <p>Sign in to your Jellyfin server.</p>
    <div class="field"><label for="srv">Server URL</label><input id="srv" type="url" inputmode="url" placeholder="https://your-server.example" required autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label for="usr">Username</label><input id="usr" required autocapitalize="off" autocorrect="off" autocomplete="username"></div>
    <div class="field"><label for="pwd">Password</label><input id="pwd" type="password" autocomplete="current-password"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-rose" id="loginBtn" type="submit">Sign in</button>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="topbar">
    <div class="logo">Velvet<span>.</span></div>
    <button class="icon-btn" id="logoutBtn" aria-label="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg></button>
  </header>

  <main id="vHome"></main>
  <main id="vLib" class="page" hidden>
    <h1 class="page-h">Library</h1>
    <div class="chips" id="libChips"></div>
    <div class="grid" id="libGrid"></div>
    <div class="more" id="libMore" hidden><button class="btn btn-glass" id="libMoreBtn">Load more</button></div>
  </main>
  <main id="vSearch" class="page" hidden>
    <h1 class="page-h">Search</h1>
    <label class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Movies, shows, episodes" autocomplete="off"></label>
    <div class="grid" id="sGrid"></div>
  </main>

  <nav class="tabbar" role="tablist">
    <button class="tab" role="tab" data-v="vHome" aria-selected="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.8 11h2.7v9.3h5V14h3v6.3h5V11h2.7z"/></svg>Home</button>
    <button class="tab" role="tab" data-v="vLib" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Library</button>
    <button class="tab" role="tab" data-v="vSearch" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
  </nav>
</div>

<!-- DETAIL -->
<div id="sheet" hidden></div>

<!-- PLAYER -->
<div id="player" hidden>
  <button class="icon-btn" id="pClose" aria-label="Close player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <video id="vid" controls playsinline autoplay></video>
  <div id="pmsg"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

/* ---------- state ---------- */
let S = {};
try { S = JSON.parse(localStorage.getItem("velvet") || "{}"); } catch {}
if (!S.deviceId) S.deviceId = "velvet-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
const save = () => { try { localStorage.setItem("velvet", JSON.stringify(S)); } catch {} };
save();

/* ---------- api ---------- */
function authHeader() {
  let h = `MediaBrowser Client="Velvet", Device="${navigator.platform || "Web"}", DeviceId="${S.deviceId}", Version="1.0.0"`;
  if (S.token) h += `, Token="${S.token}"`;
  return h;
}
async function api(path, opts = {}) {
  const r = await fetch(S.server + path, {
    ...opts,
    headers: { "Authorization": authHeader(), "X-Emby-Authorization": authHeader(), "Content-Type": "application/json", ...(opts.headers || {}) }
  });
  if (r.status === 401) { logout(); throw new Error("Session expired"); }
  if (!r.ok) throw new Error(r.status + " " + r.statusText);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
// newer servers use /UserItems, /UserViews, /Items?userId; older use /Users/{id}/...
async function tryApi(paths, opts) {
  let last;
  for (const p of paths) { try { return await api(p, opts); } catch (e) { last = e; if (e.message === "Session expired") throw e; } }
  throw last;
}
const U = () => S.userId;
const img = (id, type = "Primary", q = "fillHeight=480") => `${S.server}/Items/${id}/Images/${type}?${q}&quality=85&api_key=${S.token}`;
const items = r => Array.isArray(r) ? r : (r?.Items || []);

/* ---------- login ---------- */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#loginErr"), btn = $("#loginBtn");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Signing in…";
  S.server = $("#srv").value.trim().replace(/\/+$/, ""); S.token = null;
  try {
    const r = await api("/Users/AuthenticateByName", { method: "POST", body: JSON.stringify({ Username: $("#usr").value.trim(), Pw: $("#pwd").value }) });
    S.token = r.AccessToken; S.userId = r.User.Id; S.userName = r.User.Name; save(); boot();
  } catch (ex) {
    err.textContent = ex instanceof TypeError
      ? "Can't reach the server. Check the URL (it must be https) or the server is blocking browser requests."
      : "Sign in failed: " + ex.message;
  } finally { btn.disabled = false; btn.textContent = "Sign in"; }
});
function logout() {
  if (S.token) fetch(S.server + "/Sessions/Logout", { method: "POST", headers: { "Authorization": authHeader() } }).catch(() => {});
  S.token = null; S.userId = null; save();
  $("#app").hidden = true; $("#sheet").hidden = true; $("#login").hidden = false;
  $("#srv").value = S.server || "";
}
$("#logoutBtn").onclick = logout;

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => show(t.dataset.v));
function show(v) {
  ["vHome", "vLib", "vSearch"].forEach(id => $("#" + id).hidden = id !== v);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === v));
  window.scrollTo(0, 0);
  if (v === "vLib" && !$("#libChips").children.length) loadLibs();
}

/* ---------- cards ---------- */
function sub(it) {
  if (it.Type === "Episode") return `${it.SeriesName || ""}${it.ParentIndexNumber != null ? ` · S${it.ParentIndexNumber}E${it.IndexNumber ?? "?"}` : ""}`;
  return it.ProductionYear || (it.Type === "Series" ? "Series" : "");
}
function card(it, wide = false) {
  let src;
  if (wide) {
    if (it.Type === "Episode") src = img(it.Id, "Primary", "fillWidth=480");
    else if (it.BackdropImageTags?.length) src = img(it.Id, "Backdrop", "fillWidth=480");
    else if (it.ParentBackdropItemId) src = img(it.ParentBackdropItemId, "Backdrop", "fillWidth=480");
    else src = img(it.Id, "Thumb", "fillWidth=480");
  } else src = img(it.Id, "Primary", "fillHeight=420");
  const pct = it.UserData?.PlayedPercentage;
  const b = document.createElement("button");
  b.className = "card" + (wide ? " wide" : "");
  b.innerHTML = `<div class="art"><div class="ph">${esc(it.Name)}</div><img loading="lazy" alt="" src="${src}" onerror="this.remove()">${pct ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}</div>
    <div class="t">${esc(it.Type === "Episode" && wide ? it.Name : it.Name)}</div>${sub(it) ? `<div class="s">${esc(sub(it))}</div>` : ""}`;
  b.onclick = () => open(it);
  return b;
}
function open(it) {
  // multi-file entries / plain folders browse like a library
  if (it.IsFolder && !["Series", "Season", "BoxSet"].includes(it.Type)) { show("vLib"); browse(it.Id, it.Name); return; }
  detail(it.Id);
}
function rail(title, list, wide) {
  if (!list.length) return null;
  const s = document.createElement("section"); s.className = "rail";
  s.innerHTML = `<h2>${esc(title)}</h2><div class="scroller"></div>`;
  list.forEach(i => s.lastChild.appendChild(card(i, wide)));
  return s;
}

/* ---------- home ---------- */
async function loadHome() {
  const home = $("#vHome");
  home.innerHTML = `<div class="page"><div class="spinner"></div></div>`;
  const u = U();
  const fields = "&Fields=Overview,PrimaryImageAspectRatio&EnableImageTypes=Primary,Backdrop,Thumb";
  const [resume, views] = await Promise.all([
    tryApi([`/UserItems/Resume?userId=${u}&Limit=16&MediaTypes=Video${fields}`, `/Users/${u}/Items/Resume?Limit=16&MediaTypes=Video${fields}`]).then(items).catch(() => []),
    tryApi([`/UserViews?userId=${u}`, `/Users/${u}/Views`]).then(items).catch(() => [])
  ]);
  S.views = views;
  const latest = await Promise.all(views.slice(0, 8).map(v =>
    tryApi([`/Items/Latest?userId=${u}&parentId=${v.Id}&Limit=16${fields}`, `/Users/${u}/Items/Latest?ParentId=${v.Id}&Limit=16${fields}`]).then(items).catch(() => [])
  ));
  home.innerHTML = "";
  const pool = [...resume, ...latest.flat()];
  const heroIt = pool.find(i => i.BackdropImageTags?.length) || pool[0];
  if (heroIt) {
    const h = document.createElement("section"); h.className = "hero";
    const bg = heroIt.BackdropImageTags?.length ? img(heroIt.Id, "Backdrop", "fillWidth=1400") : heroIt.ParentBackdropItemId ? img(heroIt.ParentBackdropItemId, "Backdrop", "fillWidth=1400") : img(heroIt.Id);
    h.innerHTML = `<div class="hero-bg" style="background-image:url('${bg}')"></div>
      <div class="hero-in"><div class="eyebrow">${resume.includes(heroIt) ? "Continue watching" : "Just added"}</div>
      <h1>${esc(heroIt.Type === "Episode" ? heroIt.SeriesName : heroIt.Name)}</h1>
      ${heroIt.Overview ? `<p>${esc(heroIt.Overview)}</p>` : ""}
      <div class="row-btns"><button class="btn btn-rose" id="hPlay">${ICON_PLAY.replace("<svg", '<svg width="16" height="16"')} Play</button><button class="btn btn-glass" id="hInfo">More info</button></div></div>`;
    home.appendChild(h);
    $("#hPlay").onclick = () => detail(heroIt.Id, true);
    $("#hInfo").onclick = () => detail(heroIt.Id);
  } else {
    home.innerHTML = `<div class="page"><p class="empty">Nothing here yet.</p></div>`;
  }
  const r = rail("Continue watching", resume, true); if (r) home.appendChild(r);
  views.forEach((v, i) => { const x = rail("Latest in " + v.Name, latest[i] || [], false); if (x) home.appendChild(x); });
}

/* ---------- library ---------- */
let lib = { parent: null, start: 0 };
async function loadLibs() {
  if (!S.views) S.views = await tryApi([`/UserViews?userId=${U()}`, `/Users/${U()}/Views`]).then(items).catch(() => []);
  const c = $("#libChips"); c.innerHTML = "";
  S.views.forEach(v => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = v.Name; b.dataset.id = v.Id;
    b.onclick = () => browse(v.Id); c.appendChild(b);
  });
  if (S.views[0]) browse(S.views[0].Id);
}
async function browse(parentId, folderName, more = false) {
  if (!more) { lib = { parent: parentId, start: 0 }; $("#libGrid").innerHTML = `<div class="spinner" style="grid-column:1/-1"></div>`; }
  document.querySelectorAll("#libChips .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.id === parentId));
  $("#vLib .page-h").textContent = folderName || "Library";
  const q = `ParentId=${parentId}&SortBy=SortName&SortOrder=Ascending&StartIndex=${lib.start}&Limit=60&Fields=PrimaryImageAspectRatio,ProductionYear`;
  try {
    const r = await tryApi([`/Items?userId=${U()}&${q}`, `/Users/${U()}/Items?${q}`]);
    const g = $("#libGrid"); if (!more) g.innerHTML = "";
    items(r).forEach(i => g.appendChild(card(i)));
    lib.start += items(r).length;
    $("#libMore").hidden = !(r.TotalRecordCount > lib.start);
    if (!g.children.length) g.innerHTML = `<p class="empty" style="grid-column:1/-1">This library is empty.</p>`;
  } catch (e) { $("#libGrid").innerHTML = `<p class="empty" style="grid-column:1/-1">Couldn't load: ${esc(e.message)}</p>`; }
}
$("#libMoreBtn").onclick = () => browse(lib.parent, $("#vLib .page-h").textContent, true);

/* ---------- search ---------- */
let sT;
// keep the tab bar from riding up on the keyboard
document.addEventListener("focusin", e => { if (e.target.matches("input")) document.body.classList.add("typing"); });
document.addEventListener("focusout", () => document.body.classList.remove("typing"));
$("#q").addEventListener("input", e => {
  clearTimeout(sT);
  const term = e.target.value.trim();
  if (!term) { $("#sGrid").innerHTML = ""; return; }
  sT = setTimeout(async () => {
    $("#sGrid").innerHTML = `<div class="spinner" style="grid-column:1/-1"></div>`;
    const q = `searchTerm=${encodeURIComponent(term)}&Recursive=true&IncludeItemTypes=Movie,Series,Episode&Limit=48&Fields=ProductionYear`;
    try {
      const r = items(await tryApi([`/Items?userId=${U()}&${q}`, `/Users/${U()}/Items?${q}`]));
      if ($("#q").value.trim() !== term) return;
      const g = $("#sGrid"); g.innerHTML = "";
      r.forEach(i => g.appendChild(card(i)));
      if (!r.length) g.innerHTML = `<p class="empty" style="grid-column:1/-1">No results for “${esc(term)}”.</p>`;
    } catch (e) { $("#sGrid").innerHTML = `<p class="empty" style="grid-column:1/-1">Search failed: ${esc(e.message)}</p>`; }
  }, 350);
});

/* ---------- detail ---------- */
const getItem = id => tryApi([`/Items/${id}?userId=${U()}`, `/Users/${U()}/Items/${id}`]);
const fmtRun = t => { if (!t) return ""; const m = Math.round(t / 6e8); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };
const fmtSize = b => b ? (b / 1073741824 >= 1 ? (b / 1073741824).toFixed(1) + " GB" : Math.round(b / 1048576) + " MB") : "";

async function detail(id, autoplay = false) {
  const sh = $("#sheet");
  sh.hidden = false; sh.scrollTop = 0; document.body.style.overflow = "hidden";
  sh.innerHTML = `<button class="icon-btn d-close" id="dClose" aria-label="Close">${ICON_X}</button><div class="spinner" style="margin-top:40vh"></div>`;
  $("#dClose").onclick = closeSheet;
  let it;
  try { it = await getItem(id); } catch (e) { sh.innerHTML += `<p class="empty">Couldn't load: ${esc(e.message)}</p>`; return; }
  const bd = it.BackdropImageTags?.length ? img(it.Id, "Backdrop", "fillWidth=1400")
    : it.ParentBackdropItemId ? img(it.ParentBackdropItemId, "Backdrop", "fillWidth=1400")
    : it.Type === "Episode" ? img(it.Id, "Primary", "fillWidth=1400") : img(it.Id, "Primary", "fillWidth=900");
  const meta = [
    it.Type === "Episode" && it.ParentIndexNumber != null ? `S${it.ParentIndexNumber} · E${it.IndexNumber}` : "",
    it.ProductionYear, fmtRun(it.RunTimeTicks), it.OfficialRating,
    it.CommunityRating ? "★ " + it.CommunityRating.toFixed(1) : "",
    (it.Genres || []).slice(0, 3).join(", ")
  ].filter(Boolean);
  sh.innerHTML = `<button class="icon-btn d-close" id="dClose" aria-label="Close">${ICON_X}</button>
    <div class="d-hero" style="background-image:url('${bd}')"></div>
    <div class="d-body">
      ${it.Type === "Episode" ? `<div class="eyebrow">${esc(it.SeriesName)}</div>` : ""}
      <h1>${esc(it.Name)}</h1>
      <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>
      ${it.Overview ? `<p class="ov">${esc(it.Overview)}</p>` : ""}
      <div id="dMain"></div>
    </div>`;
  $("#dClose").onclick = closeSheet;
  const main = $("#dMain");
  if (it.Type === "Series") return seriesView(it, main);
  if (it.Type === "Season") return seriesView({ Id: it.SeriesId }, main, it.Id);
  if (it.MediaType === "Video" || ["Movie", "Episode", "Video"].includes(it.Type)) return sourcesView(it, main, autoplay);
}
function closeSheet() { $("#sheet").hidden = true; document.body.style.overflow = ""; }

async function seriesView(series, main, seasonId) {
  main.innerHTML = `<div class="spinner"></div>`;
  const seasons = items(await api(`/Shows/${series.Id}/Seasons?userId=${U()}`).catch(() => []));
  main.innerHTML = `<div class="chips" style="padding-left:0;padding-right:0;margin-top:4px" id="sChips"></div><div class="eps" id="eps"></div>`;
  const loadS = async sid => {
    document.querySelectorAll("#sChips .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.id === sid));
    const eps = $("#eps"); eps.innerHTML = `<div class="spinner"></div>`;
    const r = items(await api(`/Shows/${series.Id}/Episodes?userId=${U()}&seasonId=${sid}&Fields=Overview`).catch(() => []));
    eps.innerHTML = "";
    r.forEach(e => {
      const b = document.createElement("button"); b.className = "ep";
      const pct = e.UserData?.PlayedPercentage;
      b.innerHTML = `<div class="art"><div class="ph">E${e.IndexNumber ?? ""}</div><img loading="lazy" alt="" src="${img(e.Id, "Primary", "fillWidth=360")}" onerror="this.remove()">${pct ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}</div>
        <div style="min-width:0"><div class="t">${e.IndexNumber != null ? e.IndexNumber + ". " : ""}${esc(e.Name)}</div><div class="s">${[fmtRun(e.RunTimeTicks), e.Overview].filter(Boolean).map(esc).join(" · ")}</div></div>`;
      b.onclick = () => detail(e.Id);
      eps.appendChild(b);
    });
    if (!r.length) eps.innerHTML = `<p class="empty">No episodes.</p>`;
  };
  seasons.forEach(s => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = s.Name; b.dataset.id = s.Id;
    b.onclick = () => loadS(s.Id); $("#sChips").appendChild(b);
  });
  if (seasons.length) loadS(seasonId || seasons[0].Id); else $("#eps").innerHTML = `<p class="empty">No seasons.</p>`;
}

async function sourcesView(it, main, autoplay) {
  main.innerHTML = `<h3 class="sec-h">Streams</h3><div class="spinner" style="margin:20px auto"></div>`;
  let info;
  try {
    info = await api(`/Items/${it.Id}/PlaybackInfo?userId=${U()}`, { method: "POST", body: JSON.stringify({ UserId: U(), AutoOpenLiveStream: false }) })
      .catch(() => api(`/Items/${it.Id}/PlaybackInfo?userId=${U()}`));
  } catch (e) { main.innerHTML = `<h3 class="sec-h">Streams</h3><p class="empty">Couldn't find streams: ${esc(e.message)}</p>`; return; }
  const srcs = info?.MediaSources || [];
  main.innerHTML = `<h3 class="sec-h">Streams</h3><div class="sources" id="srcs"></div>`;
  srcs.forEach(s => {
    const v = (s.MediaStreams || []).find(m => m.Type === "Video");
    const codec = (v?.Codec || "").toLowerCase();
    const res = v?.Height ? (v.Height >= 2100 ? "4K" : v.Height + "p") : "";
    const risky = (s.Container && /mkv|avi|webm/i.test(s.Container)) || (codec && !/h264|avc|hevc|h265/.test(codec));
    const b = document.createElement("button"); b.className = "src";
    b.innerHTML = `<div style="min-width:0"><div class="n">${esc(s.Name || it.Name)}${risky ? '<span class="tag">may not play</span>' : ""}</div>
      <div class="x">${[res, codec.toUpperCase(), (s.Container || "").toUpperCase(), fmtSize(s.Size)].filter(Boolean).map(esc).join(" · ")}</div></div>
      <span class="play">${ICON_PLAY}</span>`;
    b.onclick = () => play(it, s, info.PlaySessionId);
    $("#srcs").appendChild(b);
  });
  if (!srcs.length) $("#srcs").innerHTML = `<p class="empty">No streams found for this title.</p>`;
  else if (autoplay) play(it, srcs[0], info.PlaySessionId);
}

/* ---------- player ---------- */
let P = null, hls = null;
function streamUrl(it, s) {
  if (s.DirectStreamUrl) {
    const u = s.DirectStreamUrl.startsWith("http") ? s.DirectStreamUrl : S.server + s.DirectStreamUrl;
    return /api_key=/i.test(u) ? u : u + (u.includes("?") ? "&" : "?") + "api_key=" + S.token;
  }
  if (s.TranscodingUrl) return S.server + s.TranscodingUrl;
  return `${S.server}/Videos/${it.Id}/stream?static=true&mediaSourceId=${encodeURIComponent(s.Id)}&deviceId=${S.deviceId}&api_key=${S.token}`;
}
function report(kind, extra = {}) {
  if (!P) return;
  const v = $("#vid");
  api(`/Sessions/Playing${kind}`, { method: "POST", body: JSON.stringify({
    ItemId: P.it.Id, MediaSourceId: P.s.Id, PlaySessionId: P.sid, PlayMethod: "DirectStream",
    PositionTicks: Math.floor((v.currentTime || 0) * 1e7), IsPaused: v.paused, CanSeek: true, ...extra }) }).catch(() => {});
}
function play(it, s, sid) {
  const v = $("#vid"), url = streamUrl(it, s);
  $("#pmsg").textContent = "";
  $("#player").hidden = false;
  P = { it, s, sid, timer: null };
  const resume = (it.UserData?.PlaybackPositionTicks || 0) / 1e7;
  if (hls) { hls.destroy(); hls = null; }
  const isHls = /\.m3u8/i.test(url);
  if (isHls && !v.canPlayType("application/vnd.apple.mpegurl") && window.Hls?.isSupported()) {
    hls = new Hls(); hls.loadSource(url); hls.attachMedia(v);
  } else v.src = url;
  v.onloadedmetadata = () => { if (resume > 5 && resume < v.duration - 10) v.currentTime = resume; v.play().catch(() => {}); };
  v.onerror = () => { $("#pmsg").textContent = "This stream won't play in the browser (likely MKV or an unsupported codec). Try another stream."; };
  report("");
  P.timer = setInterval(() => report("/Progress"), 10000);
  v.onpause = () => report("/Progress");
}
function stopPlayer() {
  const v = $("#vid");
  if (P) { clearInterval(P.timer); report("/Stopped"); }
  P = null; v.pause(); if (hls) { hls.destroy(); hls = null; }
  v.removeAttribute("src"); v.load();
  $("#player").hidden = true;
}
$("#pClose").onclick = stopPlayer;

/* ---------- boot ---------- */
function boot() {
  if (!S.token || !S.server) { logout(); return; }
  $("#login").hidden = true; $("#app").hidden = false;
  S.views = null; $("#libChips").innerHTML = "";
  show("vHome"); loadHome().catch(e => { $("#vHome").innerHTML = `<div class="page"><p class="empty">Couldn't load home: ${esc(e.message)}</p></div>`; });
}
boot();
</script>
